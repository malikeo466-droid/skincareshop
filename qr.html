<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>Scan KHQR to Pay | ML SKIN 1004</title>
    <meta name="title" content="Scan KHQR to Pay | ML SKIN 1004">
    <meta name="description" content="Complete your purchase securely using KHQR. Scan with Bakong or any Cambodian Mobile Banking App.">
    <meta name="robots" content="noindex, follow"> <!-- Checkout pages shouldn't be indexed -->

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="KHQR Payment | ML SKIN 1004">
    <meta property="og:description" content="Secure QR payment page for ML SKIN 1004 order checkout.">

    <!-- Fonts & CSS Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-white py-3 border-bottom border-light">
        <div class="container">
            <a class="navbar-brand fs-4 fw-bold" href="index.html" style="letter-spacing: -0.5px; color: #8A9A5B;">ML SKIN 1004</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Product</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a href="cart.html" class="text-dark position-relative text-decoration-none">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger cart-count-badge">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container py-5 flex-grow-1 text-center">
        <div class="mx-auto" style="max-width: 450px;">
            <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm border">
                <h4 class="fw-bold mb-1">Scan KHQR to Pay</h4>
                <p class="text-muted small mb-4">Scan using Bakong or any Mobile Banking App</p>

                <!-- Dynamic QR Code Container -->
                <div class="p-3 bg-light d-inline-block rounded-4 border mb-3">
                    <img id="khqrImage" 
                         src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=MLSKIN1004_PAYMENT"
                         class="img-fluid" 
                         alt="KHQR Payment Code">
                </div>

                <!-- Payment Summary -->
                <div class="border-top pt-3 mb-4 small">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Merchant:</span>
                        <strong class="text-dark">ML SKIN 1004</strong>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Total Amount:</span>
                        <strong class="text-success fs-6" id="qrTotalAmount">$0.00</strong>
                    </div>
                </div>

                <button onclick="confirmPayment()" class="btn btn-dark w-100 py-2 rounded-pill fw-semibold" style="background-color: #8A9A5B; border: none;">
                    Confirm & View Invoice
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="pt-4 pb-4 mt-auto border-top bg-white">
        <div class="container text-center">
            <p class="small text-muted mb-0">© 2026 ML SKIN 1004. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap & Custom Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
