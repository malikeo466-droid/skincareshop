<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>Order Invoice | ML SKIN 1004</title>
    <meta name="title" content="Order Invoice | ML SKIN 1004">
    <meta name="description" content="Official purchase receipt for your ML SKIN 1004 order.">
    <meta name="robots" content="noindex, follow"> <!-- Receipts shouldn't be indexed by search engines -->

    <!-- Fonts & CSS Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navigation Bar (Hidden when printing) -->
    <nav class="navbar navbar-expand-lg sticky-top bg-white py-3 border-bottom border-light d-print-none">
        <div class="container">
            <a class="navbar-brand fs-4 fw-bold" href="index.html" style="letter-spacing: -0.5px; color: #8A9A5B;">ML SKIN 1004</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Product</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a href="cart.html" class="text-dark position-relative text-decoration-none">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger cart-count-badge">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container py-5 flex-grow-1">
        <div class="mx-auto p-4 p-md-5 bg-white rounded-4 border shadow-sm" style="max-width: 650px;">
            
            <!-- Invoice Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <div>
                    <h4 class="fw-bold mb-0" style="color: #8A9A5B;">ML SKIN 1004</h4>
                    <small class="text-muted">Official Purchase Receipt</small>
                </div>
                <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill fw-semibold">Paid</span>
            </div>

            <!-- Customer & Invoice Meta Details -->
            <div class="row g-3 mb-4 small">
                <div class="col-6">
                    <span class="text-muted d-block">Invoice No</span>
                    <strong id="invoiceNumber">#INV-2026-000</strong>
                </div>
                <div class="col-6 text-end">
                    <span class="text-muted d-block">Date</span>
                    <strong id="invoiceDate">July 24, 2026</strong>
                </div>
            </div>

            <!-- Purchased Items Table -->
            <div class="table-responsive">
                <table class="table align-middle border-0 mb-4">
                    <thead class="bg-light">
                        <tr class="small text-muted">
                            <th>Item Description</th>
                            <th class="text-center">Qty</th>
                            <th class="text-end">Total</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTableBody">
                        <!-- Dynamically populated via script.js -->
                    </tbody>
                </table>
            </div>

            <!-- Total Paid Summary -->
            <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded-3 mb-4">
                <span class="fw-bold">Total Paid</span>
                <span class="fw-bold fs-4" id="invoiceTotal" style="color: #8A9A5B;">$0.00</span>
            </div>

            <!-- Print & Navigation Actions (Hidden when printing) -->
            <div class="d-flex gap-2 d-print-none">
                <button onclick="window.print()" class="btn btn-outline-dark w-50 py-2 rounded-pill fw-medium">
                    <i class="bi bi-printer me-1"></i> Print Invoice
                </button>
                <a href="index.html" class="btn btn-dark w-50 py-2 rounded-pill fw-medium text-center text-decoration-none" style="background-color: #8A9A5B; border: none;">
                    Back to Home
                </a>
            </div>
        </div>
    </main>

    <!-- Footer (Hidden when printing) -->
    <footer class="pt-4 pb-4 mt-auto border-top bg-white d-print-none">
        <div class="container text-center">
            <p class="small text-muted mb-0">© 2026 ML SKIN 1004. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap & Custom Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
